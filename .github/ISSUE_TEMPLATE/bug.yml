# Something that doesn't work as SPEC.md says.
name: Bug
description: Something that doesn't work as it should.
labels: [bug]
body:
  - type: textarea
    id: happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: From opening the app. Say if it needs particular data (a streak, a balance).
      placeholder: |
        1. Start an assignment
        2. Answer the first problem
        3. …
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where
      description: Device and browser, or the preview URL, and the app version if you know it.
      placeholder: e.g. iPad (10th gen), home-screen app, v0.1.0
