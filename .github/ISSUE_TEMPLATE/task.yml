# A feature, change or cleanup. Anything left open becomes a `question` issue before it's built.
name: Task
description: A feature, change or cleanup to build.
labels: [enhancement]
body:
  - type: textarea
    id: what
    attributes:
      label: What should change
      description: The behavior you want, in your words. Screens, labels and wording you already have in mind help.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: The problem it solves, or where the idea came from.
  - type: input
    id: spec
    attributes:
      label: Where it's specified
      description: A SPEC.md section, or "new" if the spec doesn't cover it yet.
      placeholder: e.g. SPEC §5.1, new
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: How you'd check it's right, e.g. what you'd do on the iPad and what you'd see.
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: Anything this shouldn't touch or change.
