# Quality gate for every PR and every push to main. Make "Checks" a required status check on main.
# Actions are pinned to full commit SHAs (version in the comment); Dependabot keeps them current.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Formatting (Prettier)
        run: npm run format:check
      - name: Lint (oxlint, incl. engine purity)
        run: npm run lint
      - name: Conventions (engine randomness, grade labels, never-negative wording)
        run: npm run check:conventions
      - name: Every SPEC §7 example has a test (or is pending)
        run: npm run check:spec
      - name: CHANGELOG has notes for the package.json version
        run: npm run check:changelog
      - name: Unit tests
        run: npm test
      - name: Type-check and production build
        run: npm run build

  # Smoke tests of the built app at iPad sizes, in WebKit (iPad Safari's engine)
  # and Chromium. Required on main: listed in .github/rulesets/main.json (apply it per ARCHITECTURE.md).
  playwright:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Two steps instead of `install --with-deps`, so a hang names its half instead of eating the whole
      # job cap. Each attempt is capped at 5 minutes (a healthy install is about 4 in total) and a
      # stalled one is retried once. The job cap leaves room for one retry in each step plus the tests.
      - name: Install browser system libraries
        timeout-minutes: 11
        run: |
          for attempt in 1 2; do
            timeout -k 15 300 npx playwright install-deps chromium webkit && exit 0
            echo "::warning::install-deps attempt $attempt failed or timed out"
            sleep 5
          done
          exit 1
      - name: Install browsers
        timeout-minutes: 11
        run: |
          for attempt in 1 2; do
            timeout -k 15 300 npx playwright install chromium webkit && exit 0
            echo "::warning::browser install attempt $attempt failed or timed out"
            sleep 5
          done
          exit 1
      - name: Layout and smoke tests
        run: npm run test:e2e
      - name: Keep the traces of failed tests
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
