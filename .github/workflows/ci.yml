# Quality gate for every PR and every push to main. Make "Checks" a required status check on main.
# Actions are pinned to full commit SHAs (version in the comment); Dependabot keeps them current.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Formatting (Prettier)
        run: npm run format:check
      - name: Lint (oxlint, incl. engine purity)
        run: npm run lint
      - name: Conventions (engine randomness, grade labels, never-negative wording)
        run: npm run check:conventions
      - name: Every SPEC §7 example has a test (or is pending)
        run: npm run check:spec
      - name: CHANGELOG has notes for the package.json version
        run: npm run check:changelog
      - name: Unit tests
        run: npm test
      - name: Type-check and production build
        run: npm run build

  # Smoke tests of the built app at iPad sizes, in WebKit (iPad Safari's engine)
  # and Chromium. Required on main: listed in .github/rulesets/main.json (apply it per ARCHITECTURE.md).
  playwright:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Microsoft's image already holds the browsers and their system libraries, so nothing is downloaded
    # from apt or the browser CDN at run time. Its tag must equal the exact @playwright/test version in
    # package.json and package-lock.json (check:conventions fails if not); bump all three together.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Layout and smoke tests
        run: npm run test:e2e
      - name: Keep the traces of failed tests
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
